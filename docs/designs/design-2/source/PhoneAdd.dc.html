<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone, add a bet, design 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#C9A7FF}a:hover{color:#E3CFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 34px 22px 26px; background: #1D1A2B; color: #F4F1FA; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 10px">
    <a href="#" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #262137; display: grid; place-items: center">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4F1FA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="flex-grow: 1"></div>
    <div style="height: 40px; padding: 0 16px; border-radius: 20px; background: #262137; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700">
      <span style="width: 9px; height: 9px; border-radius: 50%; background: #FF9BC8"></span>BUF @ MIA
    </div>
  </div>

  <div style="text-align: center; font-size: 28px; font-weight: 700; letter-spacing: -0.5px">Spread</div>

  <!-- the line on a dial: big glossy number in the middle, neighbours fading out -->
  <div style="position: relative; height: 190px">
    <svg aria-hidden="true" width="346" height="190" viewBox="0 0 346 190" style="position: absolute; inset: 0">
      <path d="M8 190 A170 170 0 0 1 338 190" fill="#262137"></path>
    </svg>
    <div style="position: absolute; left: 6px; top: 70px; font-size: 22px; font-weight: 800; color: #4B4366">−2.5</div>
    <div style="position: absolute; left: 56px; top: 30px; font-size: 30px; font-weight: 800; color: #8D7CB8">−3</div>
    <div style="position: absolute; left: 50%; top: 46px; transform: translateX(-50%); font-size: 84px; font-weight: 800; letter-spacing: -4px; line-height: 1; background: linear-gradient(170deg, #FFFFFF 15%, #FFC2E2 45%, #C38BFF 75%, #7C5CFF 100%); -webkit-background-clip: text; background-clip: text; color: transparent">−3.5</div>
    <div style="position: absolute; right: 56px; top: 30px; font-size: 30px; font-weight: 800; color: #8D7CB8">−4</div>
    <div style="position: absolute; right: 6px; top: 70px; font-size: 22px; font-weight: 800; color: #4B4366">−4.5</div>
    <div style="position: absolute; left: 50%; top: 144px; transform: translateX(-50%); width: 10px; height: 10px; border-radius: 50% 50% 50% 0; background: #FFFFFF; rotate: -45deg"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 12px; color: #A9A3BD">Swipe the dial · BUF must win by 4 or more</div>
  </div>

  <!-- team, as the Send to list's check rows -->
  <div style="background: #262137; border-radius: 24px; padding: 6px 16px">
    <label style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #332D47">
      <span style="width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(160deg, #FF9BC8, #7C5CFF); display: grid; place-items: center; font-size: 11px; font-weight: 800; flex-shrink: 0">BUF</span>
      <span style="flex-grow: 1; font-size: 15px; font-weight: 700">Buffalo Bills</span>
      <input type="radio" name="team" checked style="width: 24px; height: 24px; accent-color: #7C5CFF; margin: 0">
    </label>
    <label style="display: flex; align-items: center; gap: 12px; padding: 12px 0">
      <span style="width: 38px; height: 38px; border-radius: 50%; background: #2E2842; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #C9A7FF; flex-shrink: 0">MIA</span>
      <span style="flex-grow: 1; font-size: 15px; font-weight: 700">Miami Dolphins</span>
      <input type="radio" name="team" style="width: 24px; height: 24px; accent-color: #7C5CFF; margin: 0">
    </label>
  </div>

  <!-- kind of bet -->
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <button style="height: 64px; border-radius: 18px; border: 0; background: #262137; color: #A9A3BD; font: 800 10px 'Plus Jakarta Sans', sans-serif; letter-spacing: 1px">MONEY<br>LINE</button>
    <button style="height: 64px; border-radius: 18px; border: 0; background: linear-gradient(160deg, #FF9BC8 0%, #C77DFF 55%, #7C5CFF 100%); color: #FFFFFF; font: 800 10px 'Plus Jakarta Sans', sans-serif; letter-spacing: 1px">SPREAD</button>
    <button style="height: 64px; border-radius: 18px; border: 0; background: #262137; color: #A9A3BD; font: 800 10px 'Plus Jakarta Sans', sans-serif; letter-spacing: 1px">TOTAL</button>
    <button style="height: 64px; border-radius: 18px; border: 0; background: #262137; color: #A9A3BD; font: 800 10px 'Plus Jakarta Sans', sans-serif; letter-spacing: 1px">PROP</button>
  </div>

  <!-- action capsule like DROP IT! -->
  <div style="margin-top: auto; display: flex; justify-content: center">
    <div style="display: flex; align-items: center; gap: 6px; background: #262137; border-radius: 30px; padding: 4px 8px 4px 4px">
      <button style="height: 52px; padding: 0 28px; border-radius: 26px; border: 0; background: #7C5CFF; color: #FFFFFF; font: 800 15px 'Plus Jakarta Sans', sans-serif; letter-spacing: 1px">ADD IT!</button>
      <button aria-label="Add to a parlay instead" style="width: 46px; height: 46px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4F1FA" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>
      </button>
      <button aria-label="Clear" style="width: 46px; height: 46px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4F1FA" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
