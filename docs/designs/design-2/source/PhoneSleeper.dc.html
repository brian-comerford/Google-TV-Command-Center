<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone, Sleeper import, design 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#C9A7FF}a:hover{color:#E3CFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 40px 22px 26px; background: #1D1A2B; color: #F4F1FA; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
  <div style="font-size: 42px; font-weight: 800; letter-spacing: -1.5px; line-height: 1">Sleeper</div>

  <div style="height: 50px; border-radius: 25px; border: 1.5px solid #3A3354; display: flex; align-items: center; padding: 0 8px 0 20px; gap: 8px">
    <label for="sleeperUser" style="position: absolute; left: -9999px">Sleeper username</label>
    <input id="sleeperUser" value="brianc" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; color: #F4F1FA; font: 600 14px 'Plus Jakarta Sans', sans-serif; outline: none">
    <button aria-label="Find leagues" style="width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4F1FA" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    </button>
  </div>

  <div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px">
      <span style="font-size: 20px; font-weight: 700">League</span>
      <span style="font-size: 12px; color: #A9A3BD">2026 season</span>
    </div>
    <div style="background: #262137; border-radius: 24px; padding: 6px 16px">
      <label style="display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid #332D47">
        <span style="width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(160deg, #FF9BC8, #7C5CFF); display: grid; place-items: center; font-size: 11px; font-weight: 800; flex-shrink: 0">OL</span>
        <span style="flex-grow: 1"><span style="display: block; font-size: 15px; font-weight: 700">Office League</span><span style="display: block; font-size: 11px; color: #A9A3BD">12 teams</span></span>
        <input type="radio" name="league" checked style="width: 24px; height: 24px; accent-color: #7C5CFF; margin: 0">
      </label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 11px 0">
        <span style="width: 38px; height: 38px; border-radius: 50%; background: #2E2842; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #C9A7FF; flex-shrink: 0">FD</span>
        <span style="flex-grow: 1"><span style="display: block; font-size: 15px; font-weight: 700">Family Dynasty</span><span style="display: block; font-size: 11px; color: #A9A3BD">10 teams</span></span>
        <input type="radio" name="league" style="width: 24px; height: 24px; accent-color: #7C5CFF; margin: 0">
      </label>
    </div>
  </div>

  <!-- starters / roster segmented capsule -->
  <div style="display: flex; background: #262137; border-radius: 26px; padding: 4px">
    <button style="flex: 1; height: 44px; border-radius: 22px; border: 0; background: #7C5CFF; color: #FFFFFF; font: 800 13px 'Plus Jakarta Sans', sans-serif">Starters</button>
    <button style="flex: 1; height: 44px; border-radius: 22px; border: 0; background: transparent; color: #A9A3BD; font: 700 13px 'Plus Jakarta Sans', sans-serif">Whole roster</button>
  </div>

  <div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px">
      <span style="font-size: 20px; font-weight: 700">Players</span>
      <span style="font-size: 12px; color: #A9A3BD">8 found</span>
    </div>
    <div style="background: #262137; border-radius: 24px; padding: 6px 16px">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #332D47">
        <span style="width: 36px; height: 36px; border-radius: 50%; background: #2E2842; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #FF9BC8; flex-shrink: 0">QB</span>
        <span style="flex-grow: 1; font-size: 15px; font-weight: 700">Patrick Mahomes</span><span style="font-size: 12px; color: #A9A3BD">KC</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #332D47">
        <span style="width: 36px; height: 36px; border-radius: 50%; background: #2E2842; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #C9A7FF; flex-shrink: 0">WR</span>
        <span style="flex-grow: 1; font-size: 15px; font-weight: 700">Ja'Marr Chase</span><span style="font-size: 12px; color: #A9A3BD">CIN</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0">
        <span style="width: 36px; height: 36px; border-radius: 50%; border: 2px dashed #FF9A76; box-sizing: border-box; display: grid; place-items: center; font-size: 10px; font-weight: 800; color: #FF9A76; flex-shrink: 0">DEF</span>
        <span style="flex-grow: 1; font-size: 15px; font-weight: 700; color: #A9A3BD">BUF defense</span><span style="font-size: 12px; color: #FF9A76">can't track</span>
      </div>
    </div>
  </div>

  <label style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: #A9A3BD">
    <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #7C5CFF; margin: 0; flex-shrink: 0">
    <span><b style="color: #F4F1FA">Keep it matched to my lineup</b> · the TV checks Sleeper every few hours</span>
  </label>

  <div style="margin-top: auto; display: flex; justify-content: center">
    <button style="height: 54px; padding: 0 22px 0 30px; border-radius: 27px; border: 0; background: #7C5CFF; color: #FFFFFF; font: 800 15px 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; gap: 14px">
      Add to my list
      <svg aria-hidden="true" width="34" height="18" viewBox="0 0 34 18" fill="none"><path d="M2 3l6 6-6 6" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M10 3l6 6-6 6" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M19 2l13 7-13 7z" fill="#FFFFFF"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
