<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone, your list, design 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#C9A7FF}a:hover{color:#E3CFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 40px 22px 18px; background: #1D1A2B; color: #F4F1FA; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
  <div style="display: flex; align-items: flex-start; justify-content: space-between">
    <div style="font-size: 46px; font-weight: 800; letter-spacing: -1.5px; line-height: 1">My list</div>
    <a href="#" aria-label="Link your TV" style="width: 44px; height: 44px; border-radius: 50%; background: #262137; display: grid; place-items: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF9BC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="3"></rect><path d="M8 21h8"></path></svg>
    </a>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="font-size: 18px; font-weight: 700">Sunday</div>
    <div style="font-size: 12px; color: #A9A3BD">Linked to K7QM-3XPA</div>
  </div>

  <!-- statistic grid like the reference: one gradient hero, four dark tiles -->
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="grid-row: span 2; border-radius: 22px; padding: 14px; background: linear-gradient(160deg, #FF9BC8 0%, #C77DFF 55%, #7C5CFF 100%); display: flex; flex-direction: column; justify-content: space-between; min-height: 176px">
      <div style="font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -3px">7</div>
      <div style="font-size: 11px; font-weight: 800; letter-spacing: 1.5px">TRACKING</div>
    </div>
    <div style="border-radius: 20px; padding: 12px; background: #262137; display: flex; flex-direction: column; justify-content: space-between; height: 84px; box-sizing: border-box">
      <div style="display: flex; justify-content: space-between"><span style="font-size: 26px; font-weight: 800">3</span>
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9A7FF" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg></div>
      <div style="font-size: 10px; font-weight: 800; letter-spacing: 1.2px; color: #A9A3BD">PLAYERS</div>
    </div>
    <div style="border-radius: 20px; padding: 12px; background: #262137; display: flex; flex-direction: column; justify-content: space-between; height: 84px; box-sizing: border-box">
      <div style="display: flex; justify-content: space-between"><span style="font-size: 26px; font-weight: 800">1</span>
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF9BC8" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"></path></svg></div>
      <div style="font-size: 10px; font-weight: 800; letter-spacing: 1.2px; color: #A9A3BD">PARLAY</div>
    </div>
    <div style="border-radius: 20px; padding: 12px; background: #262137; display: flex; flex-direction: column; justify-content: space-between; height: 84px; box-sizing: border-box">
      <div style="display: flex; justify-content: space-between"><span style="font-size: 26px; font-weight: 800">2</span>
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9A7FF" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v8M8 12h8"></path></svg></div>
      <div style="font-size: 10px; font-weight: 800; letter-spacing: 1.2px; color: #A9A3BD">BETS</div>
    </div>
    <div style="border-radius: 20px; padding: 12px; background: #262137; display: flex; flex-direction: column; justify-content: space-between; height: 84px; box-sizing: border-box">
      <div style="display: flex; justify-content: space-between"><span style="font-size: 26px; font-weight: 800">1</span>
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF9BC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 4v5c0 4-3 7-7 9-4-2-7-5-7-9V7z"></path></svg></div>
      <div style="font-size: 10px; font-weight: 800; letter-spacing: 1.2px; color: #A9A3BD">TEAM</div>
    </div>
  </div>

  <!-- list rows like Results / Record -->
  <div style="display: flex; flex-direction: column">
    <a href="#" style="display: flex; align-items: center; gap: 14px; padding: 10px 0; color: #F4F1FA; text-decoration: none">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #262137; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #FF9BC8; flex-shrink: 0">JA</span>
      <span style="flex-grow: 1"><span style="display: block; font-size: 17px; font-weight: 700">Josh Allen</span><span style="display: block; font-size: 12px; color: #A9A3BD">4 props · 1 hit</span></span>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7E7896" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <a href="#" style="display: flex; align-items: center; gap: 14px; padding: 10px 0; color: #F4F1FA; text-decoration: none">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #262137; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #C9A7FF; flex-shrink: 0">JC</span>
      <span style="flex-grow: 1"><span style="display: block; font-size: 17px; font-weight: 700">Ja'Marr Chase</span><span style="display: block; font-size: 12px; color: #A9A3BD">Fantasy · PPR</span></span>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7E7896" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <a href="#" style="display: flex; align-items: center; gap: 14px; padding: 10px 0; color: #F4F1FA; text-decoration: none">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #262137; display: grid; place-items: center; flex-shrink: 0">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF9BC8" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>
      </span>
      <span style="flex-grow: 1"><span style="display: block; font-size: 17px; font-weight: 700">Sunday 4-leg</span><span style="display: block; font-size: 12px; color: #A9A3BD">Parlay · 4 legs</span></span>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7E7896" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <a href="#" style="display: flex; align-items: center; gap: 14px; padding: 10px 0; color: #F4F1FA; text-decoration: none">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #262137; display: grid; place-items: center; flex-shrink: 0">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5EE6A8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
      </span>
      <span style="flex-grow: 1"><span style="display: block; font-size: 17px; font-weight: 700">BUF −3.5</span><span style="display: block; font-size: 12px; color: #A9A3BD">Bet · spread</span></span>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7E7896" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </div>

  <div style="margin-top: auto; display: flex; justify-content: center">
    <button style="height: 54px; padding: 0 22px 0 30px; border-radius: 27px; border: 0; background: #7C5CFF; color: #FFFFFF; font: 800 15px 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; gap: 14px">
      Send to TV
      <svg aria-hidden="true" width="34" height="18" viewBox="0 0 34 18" fill="none"><path d="M2 3l6 6-6 6" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M10 3l6 6-6 6" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M19 2l13 7-13 7z" fill="#FFFFFF"></path></svg>
    </button>
  </div>

  <!-- bottom bar -->
  <nav style="display: flex; justify-content: space-around; align-items: center; padding-top: 6px">
    <a href="#" aria-label="List" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #F4F1FA; text-decoration: none; font-size: 10px; font-weight: 800; letter-spacing: 1px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C9A7FF" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="5"></circle><circle cx="15" cy="9" r="5" stroke="#FF9BC8"></circle><circle cx="12" cy="15" r="5"></circle></svg>ALL
    </a>
    <a href="#" aria-label="Add" style="padding: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A9A3BD" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg></a>
    <a href="#" aria-label="Open on TV" style="padding: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A9A3BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="3"></rect><path d="M10 9l4 2-4 2z"></path></svg></a>
    <a href="#" aria-label="Picks" style="padding: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A9A3BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg></a>
  </nav>
</div>
</x-dc>

</html>
