<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone, link TV and open on TV, design 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#C9A7FF}a:hover{color:#E3CFFF}
input::placeholder{color:#8F89A6}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 40px 22px 26px; background: #1D1A2B; color: #F4F1FA; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px; overflow: hidden">

  <!-- search field like "Send to . . ." -->
  <div style="display: flex; align-items: center; gap: 10px">
    <a href="#" aria-label="Back" style="width: 40px; height: 40px; display: grid; place-items: center">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9A3BD" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
    </a>
    <div style="flex-grow: 1; height: 50px; border-radius: 25px; border: 1.5px solid #3A3354; display: flex; align-items: center; padding: 0 8px 0 20px; gap: 8px">
      <label for="openInput" style="position: absolute; left: -9999px">Site, search, stream or playlist</label>
      <input id="openInput" placeholder="Open on TV . . ." style="flex-grow: 1; min-width: 0; border: 0; background: transparent; color: #F4F1FA; font: 600 14px 'Plus Jakarta Sans', sans-serif; outline: none">
      <button aria-label="Open" style="width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4F1FA" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      </button>
    </div>
  </div>

  <!-- the TV: glossy code -->
  <div>
    <div style="font-size: 22px; font-weight: 700; margin-bottom: 10px">Your TV</div>
    <div style="background: #262137; border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 12px; color: #A9A3BD">Linked with code</div>
      <div style="font-size: 36px; font-weight: 800; letter-spacing: 2px; background: linear-gradient(170deg, #FFFFFF 15%, #FFC2E2 45%, #C38BFF 80%); -webkit-background-clip: text; background-clip: text; color: transparent">K7QM-3XPA</div>
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 12px; color: #5EE6A8; font-weight: 700">TV is online</span>
        <a href="#" style="font-size: 13px; font-weight: 700">Change</a>
      </div>
    </div>
  </div>

  <!-- what to open: options with check circles -->
  <div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px">
      <span style="font-size: 22px; font-weight: 700">Open as</span>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#7E7896"><circle cx="6" cy="12" r="2"></circle><circle cx="18" cy="6" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
    </div>
    <div style="background: #262137; border-radius: 24px; padding: 6px 16px">
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #332D47">
        <span style="width: 38px; height: 38px; border-radius: 50%; background: #2E2842; display: grid; place-items: center; flex-shrink: 0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#FF9BC8"><path d="M8 5v14l11-7z"></path></svg></span>
        <span style="flex-grow: 1"><span style="display: block; font-size: 15px; font-weight: 700">Stream link</span><span style="display: block; font-size: 11px; color: #A9A3BD">.m3u8 · plays in the built-in player</span></span>
        <input type="radio" name="kind" checked style="width: 24px; height: 24px; accent-color: #7C5CFF; margin: 0">
      </label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #332D47">
        <span style="width: 38px; height: 38px; border-radius: 50%; background: #2E2842; display: grid; place-items: center; flex-shrink: 0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9A7FF" stroke-width="2.5" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"></path></svg></span>
        <span style="flex-grow: 1"><span style="display: block; font-size: 15px; font-weight: 700">Playlist</span><span style="display: block; font-size: 11px; color: #A9A3BD">.m3u link or file · adds its channels</span></span>
        <input type="radio" name="kind" style="width: 24px; height: 24px; accent-color: #7C5CFF; margin: 0">
      </label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 12px 0">
        <span style="width: 38px; height: 38px; border-radius: 50%; background: #2E2842; display: grid; place-items: center; flex-shrink: 0"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9A7FF" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></span>
        <span style="flex-grow: 1"><span style="display: block; font-size: 15px; font-weight: 700">Web page or search</span><span style="display: block; font-size: 11px; color: #A9A3BD">opens in the TV's browser</span></span>
        <input type="radio" name="kind" style="width: 24px; height: 24px; accent-color: #7C5CFF; margin: 0">
      </label>
    </div>
  </div>

  <div>
    <div style="font-size: 22px; font-weight: 700; margin-bottom: 10px">Recents</div>
    <div style="background: #262137; border-radius: 24px; padding: 12px 16px; display: flex; align-items: center; gap: 12px">
      <span style="width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(160deg, #FF9BC8, #7C5CFF); display: grid; place-items: center; flex-shrink: 0"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M8 5v14l11-7z"></path></svg></span>
      <span style="flex-grow: 1"><span style="display: block; font-size: 15px; font-weight: 700">game1.m3u8</span><span style="display: block; font-size: 11px; color: #A9A3BD">Played 4:05 PM</span></span>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; justify-content: center">
    <button style="height: 54px; padding: 0 22px 0 30px; border-radius: 27px; border: 0; background: #7C5CFF; color: #FFFFFF; font: 800 15px 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; gap: 14px">
      Open on TV
      <svg aria-hidden="true" width="34" height="18" viewBox="0 0 34 18" fill="none"><path d="M2 3l6 6-6 6" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M10 3l6 6-6 6" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M19 2l13 7-13 7z" fill="#FFFFFF"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
