<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV pop-up over another app, design 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#C9A7FF}a:hover{color:#E3CFFF}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; background: #121018; color: #F4F1FA; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden">
  <div style="position: absolute; inset: 0; display: grid; place-items: center; color: #4B4760; font-size: 15px; letter-spacing: 3px">[ ANOTHER APP'S VIDEO ]</div>

  <!-- stat pop-up: a big glossy number like the reference's 5 6 7 dial -->
  <div style="position: absolute; right: 40px; top: 36px; width: 420px; background: #1D1A2B; border-radius: 30px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(160deg, #FF9BC8, #7C5CFF); display: grid; place-items: center; font-weight: 800; font-size: 13px">JA</div>
      <div style="flex-grow: 1"><div style="font-size: 16px; font-weight: 700">Josh Allen</div><div style="font-size: 12px; color: #A9A3BD">Touchdown pass · BUF 31 – 17 MIA</div></div>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: center; gap: 14px; padding: 4px 0">
      <span style="font-size: 28px; font-weight: 800; color: #3E3757">262</span>
      <span style="font-size: 76px; font-weight: 800; letter-spacing: -3px; line-height: 1; background: linear-gradient(170deg, #FFFFFF 15%, #FFC2E2 45%, #C38BFF 75%, #7C5CFF 100%); -webkit-background-clip: text; background-clip: text; color: transparent">289</span>
      <span style="font-size: 13px; font-weight: 800; color: #C9A7FF">PASS YDS</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="border-radius: 20px; padding: 12px 14px; background: #262137; display: flex; align-items: center; gap: 10px">
        <span style="width: 26px; height: 26px; border-radius: 50%; background: #7C5CFF; display: grid; place-items: center; flex-shrink: 0"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
        <div><div style="font-size: 12px; font-weight: 700">O 249.5 yds</div><div style="font-size: 11px; color: #5EE6A8; font-weight: 700">HIT</div></div>
      </div>
      <div style="border-radius: 20px; padding: 12px 14px; background: #262137; display: flex; align-items: center; gap: 10px">
        <span style="width: 26px; height: 26px; border-radius: 50%; border: 2px solid #5EE6A8; box-sizing: border-box; flex-shrink: 0"></span>
        <div><div style="font-size: 12px; font-weight: 700">O 3.5 Pass TD</div><div style="font-size: 11px; color: #5EE6A8; font-weight: 700">3 · pace 4.3</div></div>
      </div>
    </div>
  </div>

  <!-- auto-switch offer: the reference's purple pill call to action -->
  <div style="position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); width: 780px; background: #1D1A2B; border-radius: 34px; padding: 14px 14px 14px 24px; display: flex; align-items: center; gap: 18px">
    <div style="flex-grow: 1; min-width: 0">
      <div style="font-size: 20px; font-weight: 800; letter-spacing: -0.3px">CIN in the red zone</div>
      <div style="font-size: 13px; color: #A9A3BD">1st &amp; 10 at PIT 12 · a parlay leg is in this game</div>
    </div>
    <button style="height: 52px; padding: 0 18px; border-radius: 26px; border: 0; background: transparent; color: #A9A3BD; font: 700 15px 'Plus Jakarta Sans', sans-serif">Ignore</button>
    <button style="height: 56px; padding: 0 20px 0 28px; border-radius: 28px; border: 0; background: #7C5CFF; color: #FFFFFF; font: 800 16px 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; gap: 12px">
      Watch it
      <svg aria-hidden="true" width="34" height="18" viewBox="0 0 34 18" fill="none"><path d="M2 3l6 6-6 6" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M10 3l6 6-6 6" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M19 2l13 7-13 7z" fill="#FFFFFF"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
