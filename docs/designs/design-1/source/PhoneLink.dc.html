<!doctype html>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 40px 28px 28px; background: #2E2F34; color: #EDEDF0; font-family: Poppins, system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px; overflow: hidden">
  <div style="text-align: center; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 24px; font-weight: 700; color: #F6C446; letter-spacing: 1px">LINK YOUR TV</div>
    <div style="font-size: 13px; color: #B3B5BD">On the TV, press Phone and type the code it shows.</div>
  </div>

  <!-- code entry, one box per character like the reference's keypad screen -->
  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="code1" style="font-size: 13px; color: #B3B5BD">TV code</label>
    <div style="display: flex; gap: 6px; align-items: center">
      <input id="code1" value="K" aria-label="Code letter 1" style="width: 34px; height: 46px; box-sizing: border-box; border-radius: 10px; border: 2px solid #F6C446; background: #26272B; color: #EDEDF0; text-align: center; font: 700 18px Poppins, sans-serif">
      <input value="7" aria-label="Code letter 2" style="width: 34px; height: 46px; box-sizing: border-box; border-radius: 10px; border: 2px solid #5C5E66; background: #26272B; color: #EDEDF0; text-align: center; font: 700 18px Poppins, sans-serif">
      <input value="Q" aria-label="Code letter 3" style="width: 34px; height: 46px; box-sizing: border-box; border-radius: 10px; border: 2px solid #5C5E66; background: #26272B; color: #EDEDF0; text-align: center; font: 700 18px Poppins, sans-serif">
      <input value="M" aria-label="Code letter 4" style="width: 34px; height: 46px; box-sizing: border-box; border-radius: 10px; border: 2px solid #5C5E66; background: #26272B; color: #EDEDF0; text-align: center; font: 700 18px Poppins, sans-serif">
      <span style="color: #8E9098; font-weight: 700">–</span>
      <input value="3" aria-label="Code letter 5" style="width: 34px; height: 46px; box-sizing: border-box; border-radius: 10px; border: 2px solid #5C5E66; background: #26272B; color: #EDEDF0; text-align: center; font: 700 18px Poppins, sans-serif">
      <input value="X" aria-label="Code letter 6" style="width: 34px; height: 46px; box-sizing: border-box; border-radius: 10px; border: 2px solid #5C5E66; background: #26272B; color: #EDEDF0; text-align: center; font: 700 18px Poppins, sans-serif">
      <input value="P" aria-label="Code letter 7" style="width: 34px; height: 46px; box-sizing: border-box; border-radius: 10px; border: 2px solid #5C5E66; background: #26272B; color: #EDEDF0; text-align: center; font: 700 18px Poppins, sans-serif">
      <input value="A" aria-label="Code letter 8" style="width: 34px; height: 46px; box-sizing: border-box; border-radius: 10px; border: 2px solid #5C5E66; background: #26272B; color: #EDEDF0; text-align: center; font: 700 18px Poppins, sans-serif">
    </div>
    <div style="display: flex; justify-content: center; margin-top: 8px">
      <button style="height: 44px; padding: 0 34px; border-radius: 22px; border: 0; background: #F6C446; color: #26272B; font: 700 15px Poppins, sans-serif">Link</button>
    </div>
  </div>

  <div style="height: 1px; background: #46474E"></div>

  <!-- open on TV -->
  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 18px; font-weight: 700">Open on TV</div>
    <div style="font-size: 12px; color: #B3B5BD">A site or search words open in the browser. A stream link (.m3u8) plays; a playlist link (.m3u) adds its channels.</div>
    <label for="openInput" style="font-size: 13px; color: #B3B5BD">Site, search, stream or playlist</label>
    <div style="display: flex; align-items: center; gap: 8px; height: 50px; border-radius: 25px; background: #46474E; padding: 0 6px 0 18px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B3B5BD" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="openInput" placeholder="https://… .m3u8 or .m3u" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; color: #EDEDF0; font: 500 14px Poppins, sans-serif; outline: none">
      <button style="height: 38px; padding: 0 16px; border-radius: 19px; border: 0; background: #F6C446; color: #26272B; font: 700 14px Poppins, sans-serif">Open</button>
    </div>
    <button style="align-self: flex-start; height: 40px; padding: 0 16px; border-radius: 20px; border: 2px solid #5C5E66; background: transparent; color: #EDEDF0; font: 500 13px Poppins, sans-serif">Send a playlist file (.m3u)</button>
    <div style="font-size: 13px; color: #B3B5BD">Recent</div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; gap: 12px; background: #3A3B41; border-radius: 14px; padding: 10px 12px">
        <div style="width: 34px; height: 34px; border-radius: 50%; background: #F6C446; display: grid; place-items: center; flex-shrink: 0">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="#26272B"><path d="M8 5v14l11-7z"></path></svg>
        </div>
        <div style="flex-grow: 1; min-width: 0"><div style="font-size: 13px; font-weight: 600">game1.m3u8</div><div style="font-size: 11px; color: #B3B5BD">Stream · played 4:05 PM</div></div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; background: #3A3B41; border-radius: 14px; padding: 10px 12px">
        <div style="width: 34px; height: 34px; border-radius: 50%; background: #F07B3F; display: grid; place-items: center; flex-shrink: 0">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#26272B" stroke-width="3" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>
        </div>
        <div style="flex-grow: 1; min-width: 0"><div style="font-size: 13px; font-weight: 600">Sunday Games</div><div style="font-size: 11px; color: #B3B5BD">Playlist · 48 channels</div></div>
      </div>
    </div>
  </div>

  <div style="margin-top: auto; text-align: center; font-size: 12px; color: #B3B5BD">
    Linked to <b style="color: #EDEDF0">K7QM-3XPA</b> · <a href="#">Change</a>
  </div>
</div>
