<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone, add a bet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#F6C446}a:hover{color:#FFD873}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 34px 22px 26px; background: #2E2F34; color: #EDEDF0; font-family: Poppins, system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
  <div style="text-align: center">
    <div style="font-size: 22px; font-weight: 700; color: #F6C446">Add a bet</div>
    <div style="font-size: 12px; color: #B3B5BD">BUF @ MIA · Sun 1:00 PM</div>
  </div>

  <!-- kind of bet: list with the chosen row in yellow -->
  <div style="border-radius: 14px; overflow: hidden; background: #3A3B41">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #46474E; font-size: 13px; color: #B3B5BD">
      Kind of bet
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#B3B5BD"><path d="M3 5h18l-7 8v6l-4 2v-8z"></path></svg>
    </div>
    <button style="display: block; width: 100%; text-align: left; padding: 13px 16px; border: 0; border-bottom: 1px solid #46474E; background: transparent; color: #EDEDF0; font: 500 14px Poppins, sans-serif">Moneyline</button>
    <button style="display: block; width: 100%; text-align: left; padding: 13px 16px; border: 0; background: #F6C446; color: #26272B; font: 700 14px Poppins, sans-serif">Spread</button>
    <button style="display: block; width: 100%; text-align: left; padding: 13px 16px; border: 0; border-bottom: 1px solid #46474E; background: transparent; color: #EDEDF0; font: 500 14px Poppins, sans-serif">Game total (over / under)</button>
    <button style="display: block; width: 100%; text-align: left; padding: 13px 16px; border: 0; background: transparent; color: #EDEDF0; font: 500 14px Poppins, sans-serif">Player prop</button>
  </div>

  <!-- team -->
  <div style="display: flex; gap: 10px">
    <button style="flex: 1; height: 54px; border-radius: 14px; border: 2px solid #F6C446; background: #3A3B41; color: #EDEDF0; font: 700 16px Poppins, sans-serif">BUF</button>
    <button style="flex: 1; height: 54px; border-radius: 14px; border: 2px solid #46474E; background: #3A3B41; color: #B3B5BD; font: 600 16px Poppins, sans-serif">MIA</button>
  </div>

  <!-- the line, set with − / + like the reference's amount screen -->
  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 0 6px">
    <div style="font-size: 13px; color: #B3B5BD">Points</div>
    <div style="display: flex; align-items: center; gap: 26px">
      <button aria-label="Minus half a point" style="width: 52px; height: 52px; border-radius: 50%; border: 2px solid #5C5E66; background: transparent; display: grid; place-items: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EDEDF0" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"></path></svg>
      </button>
      <div style="font-size: 40px; font-weight: 800; color: #F6C446; min-width: 120px; text-align: center">−3.5</div>
      <button aria-label="Plus half a point" style="width: 52px; height: 52px; border-radius: 50%; border: 2px solid #5C5E66; background: transparent; display: grid; place-items: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EDEDF0" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>
    <div style="font-size: 12px; color: #B3B5BD">BUF must win by 4 or more</div>
  </div>

  <div style="height: 1px; background: #46474E"></div>

  <!-- what the TV will show -->
  <div style="display: flex; align-items: center; gap: 12px; background: #3A3B41; border-radius: 16px; padding: 12px 14px">
    <svg aria-hidden="true" width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke="#2C2D32" stroke-width="5"></circle><circle cx="22" cy="22" r="18" fill="none" stroke="#5C5E66" stroke-width="5" stroke-dasharray="4 6" transform="rotate(-90 22 22)"></circle></svg>
    <div style="flex-grow: 1"><div style="font-size: 14px; font-weight: 600">BUF −3.5</div><div style="font-size: 12px; color: #B3B5BD">On the TV: covering, hit or lost. No odds or payouts.</div></div>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; gap: 14px">
    <a href="#" aria-label="Back" style="width: 52px; height: 52px; border-radius: 50%; border: 2px solid #5C5E66; box-sizing: border-box; display: grid; place-items: center; flex-shrink: 0">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EDEDF0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </a>
    <button style="flex-grow: 1; height: 54px; border-radius: 27px; border: 0; background: #F6C446; color: #26272B; font: 700 17px Poppins, sans-serif">Add bet</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
