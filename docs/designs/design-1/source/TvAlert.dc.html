<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV pop-up over another app</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#F6C446}a:hover{color:#FFD873}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; background: #151618; color: #EDEDF0; font-family: Poppins, system-ui, sans-serif; overflow: hidden">
  <!-- the other app's video -->
  <div style="position: absolute; inset: 0; display: grid; place-items: center; color: #55575E; font-size: 15px; letter-spacing: 3px">[ ANOTHER APP'S VIDEO ]</div>

  <!-- stat pop-up, top right -->
  <div style="position: absolute; right: 40px; top: 36px; width: 440px; background: #34353B; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="width: 52px; height: 52px; border-radius: 50%; background: #46474E; display: grid; place-items: center; font-weight: 700; color: #F6C446; flex-shrink: 0">JA</div>
      <div style="flex-grow: 1; min-width: 0">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: #F07B3F">NFL · BIG PLAY</div>
        <div style="font-size: 17px; font-weight: 700">Josh Allen: +27 pass yds, +1 TD</div>
        <div style="font-size: 12px; color: #B3B5BD">19/28 · 289 YDS · 3 TD · BUF 31 – 17 MIA</div>
      </div>
    </div>
    <div style="display: flex; gap: 10px">
      <div style="flex: 1; display: flex; align-items: center; gap: 10px; background: #3E3F46; border-radius: 14px; padding: 8px 10px">
        <svg aria-hidden="true" width="38" height="38" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke="#2C2D32" stroke-width="5"></circle><circle cx="22" cy="22" r="18" fill="none" stroke="#4FC48A" stroke-width="5" stroke-dasharray="113.1 113.1" transform="rotate(-90 22 22)"></circle><path d="M15 22l5 5 9-10" fill="none" stroke="#4FC48A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <div><div style="font-size: 13px; font-weight: 600">O 249.5 Pass Yds</div><div style="font-size: 11px; color: #4FC48A; font-weight: 600">HIT · 289</div></div>
      </div>
      <div style="flex: 1; display: flex; align-items: center; gap: 10px; background: #3E3F46; border-radius: 14px; padding: 8px 10px">
        <svg aria-hidden="true" width="38" height="38" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke="#2C2D32" stroke-width="5"></circle><circle cx="22" cy="22" r="18" fill="none" stroke="#F6C446" stroke-width="5" stroke-dasharray="97 113.1" stroke-linecap="round" transform="rotate(-90 22 22)"></circle><text x="22" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#EDEDF0">3</text></svg>
        <div><div style="font-size: 13px; font-weight: 600">O 3.5 Pass TD</div><div style="font-size: 11px; color: #4FC48A; font-weight: 600">On pace for 4.3</div></div>
      </div>
    </div>
  </div>

  <!-- auto-switch offer, bottom: yellow like the reference's highlighted card -->
  <div style="position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); width: 760px; background: #F6C446; color: #26272B; border-radius: 22px; padding: 16px 18px; display: flex; align-items: center; gap: 16px">
    <div style="width: 52px; height: 52px; border-radius: 50%; background: #26272B; display: grid; place-items: center; flex-shrink: 0">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F07B3F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"></path><path d="M12 10v4M12 17h.01"></path></svg>
    </div>
    <div style="flex-grow: 1; min-width: 0">
      <div style="font-size: 18px; font-weight: 800">CIN in the red zone · PIT 12</div>
      <div style="font-size: 13px; font-weight: 500">Your parlay has a leg here. Press OK to watch CIN @ PIT on Gridiron Two.</div>
    </div>
    <button style="height: 44px; padding: 0 22px; border-radius: 22px; border: 0; background: #26272B; color: #F6C446; font: 700 15px Poppins, sans-serif">Watch</button>
    <button style="height: 44px; padding: 0 18px; border-radius: 22px; border: 2px solid #26272B; background: transparent; color: #26272B; font: 600 15px Poppins, sans-serif">Ignore</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
