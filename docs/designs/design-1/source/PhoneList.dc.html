<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone, your list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
a{color:#F6C446}a:hover{color:#FFD873}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 28px 20px 24px; background: #2E2F34; color: #EDEDF0; font-family: Poppins, system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <div>
      <div style="font-size: 22px; font-weight: 700; color: #F6C446">Your list</div>
      <div style="font-size: 12px; color: #B3B5BD">Linked to TV K7QM-3XPA</div>
    </div>
    <button aria-label="Add" style="width: 46px; height: 46px; border-radius: 50%; border: 0; background: #F6C446; display: grid; place-items: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#26272B" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </div>

  <!-- parlay as the yellow hero card -->
  <div style="background: #F6C446; color: #26272B; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 1px">4-LEG PARLAY</span>
      <span style="padding: 3px 10px; border-radius: 10px; background: #26272B; color: #F6C446; font-size: 11px; font-weight: 700">LIVE</span>
    </div>
    <div style="font-size: 20px; font-weight: 800">Sunday 4-leg</div>
    <div style="position: relative; height: 14px; margin: 0 6px">
      <div style="position: absolute; left: 0; right: 0; top: 6px; height: 2px; background: #26272B; opacity: 0.35"></div>
      <div style="position: absolute; left: 0; width: 33%; top: 6px; height: 2px; background: #26272B"></div>
      <div style="position: absolute; left: -6px; top: 0; width: 14px; height: 14px; border-radius: 50%; background: #26272B"></div>
      <div style="position: absolute; left: calc(33% - 7px); top: 0; width: 14px; height: 14px; border-radius: 50%; border: 3px solid #26272B; box-sizing: border-box"></div>
      <div style="position: absolute; left: calc(66% - 7px); top: 0; width: 14px; height: 14px; border-radius: 50%; border: 3px solid #26272B; box-sizing: border-box"></div>
      <div style="position: absolute; right: -6px; top: 0; width: 14px; height: 14px; border-radius: 50%; border: 3px solid #26272B; box-sizing: border-box"></div>
    </div>
    <div style="font-size: 13px; font-weight: 600">1 of 4 hit · 3 to go</div>
  </div>

  <!-- list rows: ring or status circle, name, what's tracked, arrow -->
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 12px; background: #3A3B41; border-radius: 16px; padding: 10px 12px">
      <svg aria-hidden="true" width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke="#2C2D32" stroke-width="5"></circle><circle cx="22" cy="22" r="18" fill="none" stroke="#4FC48A" stroke-width="5" stroke-dasharray="113.1 113.1" transform="rotate(-90 22 22)"></circle><text x="22" y="26" text-anchor="middle" font-size="10" font-weight="700" fill="#EDEDF0">4</text></svg>
      <div style="flex-grow: 1; min-width: 0"><div style="font-size: 15px; font-weight: 600">Josh Allen</div><div style="font-size: 12px; color: #B3B5BD">BUF · QB · 4 props</div></div>
      <a href="#" aria-label="Edit Josh Allen" style="width: 34px; height: 34px; border-radius: 50%; border: 2px solid #5C5E66; box-sizing: border-box; display: grid; place-items: center">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#EDEDF0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; background: #3A3B41; border-radius: 16px; padding: 10px 12px">
      <svg aria-hidden="true" width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke="#2C2D32" stroke-width="5"></circle><circle cx="22" cy="22" r="18" fill="none" stroke="#F6C446" stroke-width="5" stroke-dasharray="81 113.1" stroke-linecap="round" transform="rotate(-90 22 22)"></circle></svg>
      <div style="flex-grow: 1; min-width: 0"><div style="font-size: 15px; font-weight: 600">Ja'Marr Chase</div><div style="font-size: 12px; color: #B3B5BD">CIN · WR · fantasy, PPR</div></div>
      <a href="#" aria-label="Edit Ja'Marr Chase" style="width: 34px; height: 34px; border-radius: 50%; border: 2px solid #5C5E66; box-sizing: border-box; display: grid; place-items: center">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#EDEDF0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; background: #3A3B41; border-radius: 16px; padding: 10px 12px">
      <div style="width: 44px; height: 44px; border-radius: 50%; background: #4FC48A; display: grid; place-items: center; flex-shrink: 0">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E2A22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
      </div>
      <div style="flex-grow: 1; min-width: 0"><div style="font-size: 15px; font-weight: 600">BUF −3.5</div><div style="font-size: 12px; color: #B3B5BD">Bet · spread</div></div>
      <a href="#" aria-label="Edit BUF -3.5" style="width: 34px; height: 34px; border-radius: 50%; border: 2px solid #5C5E66; box-sizing: border-box; display: grid; place-items: center">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#EDEDF0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; background: #3A3B41; border-radius: 16px; padding: 10px 12px">
      <div style="width: 44px; height: 44px; border-radius: 50%; background: #46474E; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #F6C446; flex-shrink: 0">BUF</div>
      <div style="flex-grow: 1; min-width: 0"><div style="font-size: 15px; font-weight: 600">Buffalo Bills</div><div style="font-size: 12px; color: #B3B5BD">Team · scores and big plays</div></div>
      <a href="#" aria-label="Edit Buffalo Bills" style="width: 34px; height: 34px; border-radius: 50%; border: 2px solid #5C5E66; box-sizing: border-box; display: grid; place-items: center">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#EDEDF0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
    </div>
  </div>

  <!-- quick actions as square icon tiles (like the reference's category grid) -->
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
    <a href="#" style="height: 70px; border-radius: 16px; background: #3A3B41; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #EDEDF0; text-decoration: none; font-size: 11px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F6C446" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v8M8 12h8"></path></svg>Bet
    </a>
    <a href="#" style="height: 70px; border-radius: 16px; background: #3A3B41; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #EDEDF0; text-decoration: none; font-size: 11px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F6C446" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>Parlay
    </a>
    <a href="#" style="height: 70px; border-radius: 16px; background: #3A3B41; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #EDEDF0; text-decoration: none; font-size: 11px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F6C446" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>Picks
    </a>
    <a href="#" style="height: 70px; border-radius: 16px; background: #3A3B41; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #EDEDF0; text-decoration: none; font-size: 11px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F6C446" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>Sleeper
    </a>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 8px">
    <button style="width: 100%; height: 54px; border-radius: 27px; border: 0; background: #F6C446; color: #26272B; font: 700 17px Poppins, sans-serif">Send to TV</button>
    <div style="font-size: 12px; color: #B3B5BD">Sent 4:12 PM · the TV updates within 20 seconds</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
