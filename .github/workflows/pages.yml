name: Phone website

on:
  push:
    paths: ["web/**", "tools/build-web-data.js", ".github/workflows/pages.yml"]
  workflow_dispatch:
  # Refresh team rosters daily (trades, signings, call-ups).
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Pages only deploys from the repository's default branch.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Save teams and rosters from ESPN
        run: node tools/build-web-data.js web/data
      # Phones (Safari especially) keep old copies of style.css and app.js; a version in the link
      # makes every deploy load the new files.
      - name: Stamp the version on the page's files
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -e "s/href=\"style.css\"/href=\"style.css?v=$v\"/" -e "s/src=\"app.js\"/src=\"app.js?v=$v\"/" -e "s/src=\"espn.js\"/src=\"espn.js?v=$v\"/" web/index.html
          grep -n "?v=$v" web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
