name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test core logic and build APK
        run: ./gradlew --no-daemon :core:test :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SportsCommandCenter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SportsCommandCenter-apk
          path: SportsCommandCenter.apk

      # A release gives a fixed download link you can type into the "Downloader" app on the TV:
      # https://github.com/<owner>/<repo>/releases/latest/download/SportsCommandCenter.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref_type != 'tag' && github.ref_name != 'non-browser'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sports Command Center 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: SportsCommandCenter.apk
          # The app shows the "What's new:" line in its update notice (core Updates.whatsNew).
          body: |
            What's new: ${{ github.event.head_commit.message }}

            Built from ${{ github.ref_name }} @ ${{ github.sha }}.
            Install on Google TV: open the Downloader app and enter
            https://github.com/${{ github.repository }}/releases/latest/download/SportsCommandCenter.apk

      # A saved version (the "non-browser" branch, or any pushed tag) becomes its own release with a
      # fixed download link, without changing what "latest" points to.
      - name: Publish saved version
        if: github.event_name != 'pull_request' && (github.ref_type == 'tag' || github.ref_name == 'non-browser')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Sports Command Center (${{ github.ref_name }} version)
          make_latest: false
          files: SportsCommandCenter.apk
          body: |
            Saved version "${{ github.ref_name }}" @ ${{ github.sha }}.
            Install on Google TV: open the Downloader app and enter
            https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/SportsCommandCenter.apk
